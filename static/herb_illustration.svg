      <path d="M90 132 C74 110 54 100 34 78" stroke-width="2"/>
      <path d="M90 132 C104 108 126 98 140 72" stroke-width="2"/>
      <path d="M90 132 C90 106 96 84 90 58" stroke-width="2"/>
      <path d="M34 78 C24 58 24 40 12 22" stroke-width="1.6"/>
      <path d="M34 78 C46 62 56 54 64 36" stroke-width="1.6"/>
      <path d="M140 72 C142 50 154 36 150 14" stroke-width="1.6"/>
