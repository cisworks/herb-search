<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -60 650 860" width="650" height="860">
  <!-- 생약 검색 시작화면 배경 그림: 감수·청상자·상륙·서봄화 네 품목의
       실제 형태(잎맥·꽃차례·열매 배열·뿌리 모양)를 최대한 사실적으로
       살려 그린 원본 라인아트. 색은 넣지 않고 사이트 포인트 컬러 한
       가지 톤(윤곽선 + 옅은 동색 채움)만 사용한다. -->
  <g fill="none" stroke="#2f6f4f" stroke-linecap="round" stroke-linejoin="round" opacity="0.38">

