            <path d="M0 -8 C-2 -18 -2 -30 0 -40 C2 -30 2 -18 0 -8 Z" transform="rotate(120)"/>
            <path d="M0 -8 C-2 -18 -2 -30 0 -40 C2 -30 2 -18 0 -8 Z" transform="rotate(160)"/>
