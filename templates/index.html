<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생약 검색</title>
<style>
  :root {
    --main: #2f6f4f;
    --main-dark: #234f38;
    --bg: #f6f7f4;
    --card: #ffffff;
    --border: #dfe3dc;
    --text: #2a2a2a;
    --sub: #6b6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    position: relative;
    background: var(--main);
    color: #fff;
    padding: 22px 20px;
    text-align: center;
  }
  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
  }
  .org-badge {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .org-badge img {
    width: 34px;
    height: 34px;
    flex-shrink: 0;
  }
  .org-badge .org-name {
    text-align: left;
    font-size: 0.72rem;
    line-height: 1.35;
    opacity: 0.95;
  }
  header h1 { margin: 0 0 4px; font-size: 1.5rem; }
  header p { margin: 0; font-size: 0.85rem; opacity: 0.9; }

  .wrap {
    margin: 0 auto;
    padding: 24px 16px 60px;
    display: flex;
    align-items: flex-start;
    gap: 20px;
  }
  .left-panel {
    flex: 0 0 auto;
    width: max-content;
    min-width: 400px;
    max-width: 45%;
    position: sticky;
    top: 24px;
  }
  .right-panel {
    flex: 1 1 0;
    min-width: 0;
  }
  @media (max-width: 860px) {
    .wrap { flex-direction: column; }
    .left-panel { position: static; width: 100%; }
    .right-panel { width: 100%; }
  }

  .search-box {
    position: relative;
    margin-bottom: 8px;
  }
  .search-box input {
    width: 100%;
    padding: 14px 40px 14px 16px;
    font-size: 1.05rem;
    border: 2px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s;
  }
  .search-box input:focus { border-color: var(--main); }
  .combo-toggle {
    position: absolute;
    right: 6px;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    color: var(--sub);
    font-size: 0.9rem;
    cursor: pointer;
    border-radius: 6px;
  }
  .combo-toggle:hover { color: var(--main-dark); background: #eef3ec; }

  /* 화살표로 여는 공정서 전체 목록 팝업. 검색 결과(#results)와는 완전히
     별개의 레이어라서, 이 팝업을 열고 닫아도 검색 결과 카드는 그대로
     남아 있다. */
  .combo-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    right: 0;
    z-index: 30;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 12px 28px rgba(0, 0, 0, 0.15);
    overflow-y: auto;
    overflow-x: auto;
    max-height: 60vh;
  }

  .meta {
    font-size: 0.8rem;
    color: var(--sub);
    margin-bottom: 18px;
  }

  .results {
    display: flex;
    flex-direction: column;
    gap: 48px;
    margin-top: 48px;
    margin-bottom: 24px;
  }
  /* 카드 하나가 길어지면(품목이 많으면) 카드 안에서만 스크롤되고, 맨 위
     "공정서 (숫자)" 라벨은 sticky로 고정되어 스크롤해도 항상 보인다. */
  .result-group {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow-y: auto;
    overflow-x: auto;
    flex: none;
    max-height: min(480px, 55vh);
  }
  .result-item {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    white-space: nowrap;
  }
  .result-item:last-child { border-bottom: none; }
  .result-item:hover { background: #f0f5ef; }
  .result-item .rname { font-weight: 600; }
  .synonym { font-size: 90%; font-weight: 500; }
  .result-item .rsub { font-size: 0.8rem; color: var(--sub); white-space: nowrap; }
  .source-badge {
    display: inline-block;
    border: 1.5px solid var(--main-dark);
    color: var(--main-dark);
    font-size: 0.68rem;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 3px;
    margin-left: 6px;
    line-height: 1.5;
    vertical-align: middle;
  }
  .empty-msg {
    text-align: center;
    color: var(--sub);
    padding: 20px;
    font-size: 0.9rem;
  }
  .group-label {
    position: sticky;
    top: 0;
    z-index: 1;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--main-dark);
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  .detail.sensory-mode {
    padding: 0;
    overflow: hidden;
    position: relative;
    height: calc(100vh - 48px);
    max-width: none;
    margin: 0;
  }
  .sensory-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: none;
  }
  .sensory-close {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: none;
    background: rgba(30, 30, 30, 0.65);
    color: #fff;
    font-size: 1.1rem;
    line-height: 1;
    cursor: pointer;
    z-index: 5;
  }
  .sensory-close:hover {
    background: rgba(30, 30, 30, 0.85);
  }

  .detail {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    display: none;
    max-width: 900px;
    margin: 0 auto;
  }
  .detail.show { display: block; }
  .detail-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: calc(100vh - 180px);
    min-height: 200px;
    color: var(--sub);
    font-size: 0.95rem;
    background: var(--card);
    border: 1px dashed var(--border);
    border-radius: 12px;
  }
  .detail-placeholder.hide { display: none; }
  .detail-header {
    border-bottom: 2px solid var(--main);
    padding-bottom: 14px;
    margin-bottom: 16px;
  }
  .detail-header h2 {
    margin: 0 0 4px;
    color: var(--main-dark);
    font-size: 1.4rem;
  }
  .detail-header .en {
    color: var(--sub);
    font-style: italic;
    margin: 0 0 2px;
  }
  .detail-header .latin {
    color: var(--sub);
    font-style: italic;
    font-size: 0.9rem;
    margin: 0;
  }
  .definition {
    background: #f0f5ef;
    border-left: 4px solid var(--main);
    padding: 12px 14px;
    border-radius: 6px;
    margin-bottom: 18px;
    line-height: 1.6;
  }
  .definition p {
    margin: 0 0 10px;
    white-space: pre-line;
  }
  .definition p:last-child {
    margin-bottom: 0;
  }
  .definition p.quantitative {
    font-size: 90%;
    color: var(--sub);
  }
  .definition p.quantitative sub {
    font-size: 80%;
  }
  .section {
    margin-bottom: 16px;
  }
  .section .label {
    display: inline-block;
    background: var(--main);
    color: #fff;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 6px;
    margin-bottom: 6px;
  }
  .section .body {
    white-space: pre-line;
    line-height: 1.7;
    padding-left: 2px;
  }
  .orig-table {
    border-collapse: collapse;
    margin: 8px 0;
    font-size: 0.92rem;
  }
  .orig-table td {
    border: 1px solid var(--border);
    padding: 4px 10px;
    text-align: center;
  }
  .orig-table tr:first-child td {
    background: var(--bg);
    font-weight: 600;
  }
  .formula-line {
    text-align: center;
    margin: 4px 0;
    font-size: 95%;
  }
  .item-list {
    list-style: none;
    margin: 0;
    padding-left: 0;
  }
  .item-list .item-list {
    margin-top: 4px;
    padding-left: 22px;
  }
  .item-list > li {
    margin-bottom: 8px;
    line-height: 1.7;
  }
  .item-marker {
    display: inline-block;
    min-width: 1.6em;
    font-weight: 600;
    color: var(--main-dark);
  }
  .item-list .item-list .item-marker {
    color: var(--sub);
    font-weight: 500;
  }
  .ref-link {
    color: var(--main-dark);
    text-decoration: underline;
    text-decoration-style: dotted;
    cursor: pointer;
  }
  .ref-link:hover {
    color: var(--main);
  }
  .close-btn {
    float: right;
    background: none;
    border: none;
    font-size: 1.2rem;
    color: var(--sub);
    cursor: pointer;
  }

  .tab-bar {
    display: flex;
    gap: 6px;
    margin-bottom: 14px;
  }
  .tab-btn {
    flex: 1 1 0;
    padding: 10px 12px;
    font-size: 0.92rem;
    font-weight: 600;
    border: 2px solid var(--border);
    background: #fff;
    color: var(--sub);
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s, color 0.15s;
  }
  .tab-btn:hover { border-color: var(--main); color: var(--main-dark); }
  .tab-btn.active {
    background: var(--main);
    border-color: var(--main);
    color: #fff;
  }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }
</style>
</head>
<body>
<header>
  <div class="org-badge">
    <img src="{{ url_for('static', filename='seoul_logo.png') }}" alt="서울시 휘장">
    <div class="org-name">
      <div>서울시보건환경연구원</div>
      <div>강북농수산물검사소</div>
    </div>
  </div>
  <div class="header-inner">
    <h1>생약 검색</h1>
    <p>공정서(대한약전, 생약규격집) {{ total_count }}품목, 관능검사해설서 {{ sensory_count }}품목</p>
  </div>
</header>

<div class="wrap">
  <div class="left-panel">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="nameTabBtn" data-tab="nameTab">생약 검색</button>
      <button type="button" class="tab-btn" id="testTabBtn" data-tab="testTab">시험항목 검색</button>
    </div>

    <div class="tab-panel active" id="nameTab">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="생약명을 입력하거나 목록에서 선택하세요" autocomplete="off">
        <button type="button" class="combo-toggle" id="comboToggle" aria-label="공정서 전체 목록 보기" title="공정서 전체 목록 보기">▾</button>
        <div class="combo-dropdown" id="comboDropdown" style="display:none;"></div>
      </div>
      <div class="results" id="results" style="display:none;"></div>
    </div>

    <div class="tab-panel" id="testTab">
      <div class="search-box">
        <input type="text" id="testItemInput" placeholder="시험항목을 선택하세요" autocomplete="off" readonly>
        <button type="button" class="combo-toggle" id="testItemToggle" aria-label="시험항목 목록 보기" title="시험항목 목록 보기">▾</button>
        <div class="combo-dropdown" id="testItemDropdown" style="display:none;"></div>
      </div>
      <div class="results" id="testResults" style="display:none;"></div>
    </div>
  </div>
  <div class="right-panel">
    <div class="detail-placeholder" id="detailPlaceholder">왼쪽에서 생약을 검색하고 선택하세요.</div>
    <div class="detail" id="detail"></div>
  </div>
</div>

<script>
const searchInput = document.getElementById('searchInput');
const comboToggle = document.getElementById('comboToggle');
const comboDropdown = document.getElementById('comboDropdown');
const resultsBox = document.getElementById('results');
const detailBox = document.getElementById('detail');
const detailPlaceholder = document.getElementById('detailPlaceholder');

let debounceTimer = null;
let officialListCache = null;
// 전체 목록 fetch(599건, 느림)와 타이핑에 의한 검색 fetch(적음, 빠름)가
// 겹치면 늦게 끝난 쪽이 화면을 덮어써 버릴 수 있다. 매 요청마다 번호를
// 매겨, 그 사이 더 최신 요청이 시작됐으면 응답이 와도 그리지 않도록 막는다.
let requestSeq = 0;

async function getOfficialList() {
  if (!officialListCache) {
    const res = await fetch('/api/list');
    officialListCache = await res.json();
  }
  return officialListCache;
}

// 콤보박스 전체 목록에는 국문명만 보여준다(이명, 영문명, 라틴 학명은 뺀다).
// korean_name에는 "갈화(葛花) 갈조화(葛條花), Pueraria Flower"처럼 이명이
// 이미 이어붙어 있는 경우가 있어, 이명이 빠진 name_primary를 우선 쓴다.
function comboRowHtml(it) {
  const primary = it.name_primary || it.korean_name;
  return `
    <div class="result-item" data-id="${it.id}">
      <span class="rname">${escapeHtml(primary)}${sourceBadge(it.source_tag)}</span>
    </div>
  `;
}

// 화살표로 여는 전체 목록 팝업(comboDropdown)은 검색 결과(#results)와
// 완전히 분리된 레이어다. 그래서 팝업을 열고 닫아도 이미 표시된 검색
// 결과 카드는 절대 사라지지 않는다.
async function showAllOfficial() {
  const seq = ++requestSeq;
  const items = await getOfficialList();
  if (seq !== requestSeq) return;
  const rows = items.map(comboRowHtml).join('');
  comboDropdown.innerHTML = `
    <div class="group-label">공정서 전체 목록 (${items.length})</div>
    ${rows}
  `;
  comboDropdown.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => {
      const it = items.find(x => String(x.id) === el.dataset.id);
      if (it) selectComboItem(it);
    });
  });
}

function openComboDropdown() {
  showAllOfficial();
  comboDropdown.style.display = 'block';
  fitComboDropdownHeight();
}

function closeComboDropdown() {
  comboDropdown.style.display = 'none';
}

// 공정서 전체 목록 팝업도 창 크기에 맞춰 세로로 늘어나되, 창 아래끝에서
// 한 칸(약 48px) 정도는 남기고 그 안에서 스크롤되게 한다.
function fitComboDropdownHeight() {
  if (comboDropdown.style.display !== 'block') return;
  const top = comboDropdown.getBoundingClientRect().top;
  const bottomGap = 48;
  const height = window.innerHeight - top - bottomGap;
  comboDropdown.style.maxHeight = Math.max(160, height) + 'px';
}

window.addEventListener('resize', fitComboDropdownHeight);

// 콤보박스에서 품목을 고르면: 드롭다운 목록을 닫고, 검색칸에 한글
// 생약명만(한자 없이) 채운 다음, 그 이름으로 실제 검색을 실행해
// 공정서/관능검사해설서 카드에 결과를 보여주고, 고른 품목의 상세를
// 오른쪽 화면에 표시한다(동명이품목이 있어도 고른 id를 그대로 보여주기
// 위해 검색 결과와 무관하게 마지막에 다시 확정한다).
async function selectComboItem(it) {
  closeComboDropdown();
  const nameOnly = it.name_only || it.name_primary || it.korean_name;
  searchInput.value = nameOnly;
  await doSearch(nameOnly);
  showDetail(it.id);
}

comboToggle.addEventListener('click', () => {
  if (comboDropdown.style.display === 'block') {
    closeComboDropdown();
  } else {
    openComboDropdown();
  }
});

// ---- 탭 전환 ----------------------------------------------------------
const tabButtons = document.querySelectorAll('.tab-btn');
tabButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    tabButtons.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.tab).classList.add('active');
    closeComboDropdown();
    closeTestItemDropdown();
    if (btn.dataset.tab === 'testTab') fitTestResultsHeight();
  });
});

// ---- 시험항목 검색 탭 ---------------------------------------------------
// 확인시험과 순도시험의 하위 항목들을 드롭다운에서 골라, 그 항목이 있는
// 공정서 품목을 /api/test_item_search 로 찾아 공정서 카드에 표시한다.
// label은 목록에 보이는 이름, keyword는 실제 검색에 쓰는 낱말이다
// (예: 목록엔 "이물시험"으로 보이지만, 원문 순도시험 항목에는 "이물"로
// 적혀 있어서 검색은 "이물"로 한다).
const TEST_ITEMS = [
  { label: '확인시험', keyword: '확인시험' },
  { label: '정량법', keyword: '정량법' },
  { label: '이물시험', keyword: '이물' },
  { label: '변패', keyword: '변패' },
  { label: '잔류농약', keyword: '잔류농약' },
  { label: '납', keyword: '납' },
  { label: '비소', keyword: '비소' },
  { label: '수은', keyword: '수은' },
  { label: '카드뮴', keyword: '카드뮴' },
  { label: '이산화황', keyword: '이산화황' },
  { label: '벤조피렌', keyword: '벤조피렌' },
  { label: '곰팡이독소', keyword: '곰팡이독소' },
];

const testItemInput = document.getElementById('testItemInput');
const testItemToggle = document.getElementById('testItemToggle');
const testItemDropdown = document.getElementById('testItemDropdown');
const testResultsBox = document.getElementById('testResults');

// 시험항목 검색결과 카드에는 이명/영문명/학명 등은 빼고 국문명만 보여준다.
function testResultRowHtml(it) {
  const primary = it.name_primary || it.korean_name;
  return `
    <div class="result-item" data-id="${it.id}">
      <span class="rname">${escapeHtml(primary)}${sourceBadge(it.source_tag)}</span>
    </div>
  `;
}

function openTestItemDropdown() {
  testItemDropdown.innerHTML = TEST_ITEMS.map((t, i) => `
    <div class="result-item" data-idx="${i}">
      <span class="rname">${escapeHtml(t.label)}</span>
    </div>
  `).join('');
  testItemDropdown.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => selectTestItem(TEST_ITEMS[Number(el.dataset.idx)]));
  });
  testItemDropdown.style.display = 'block';
}

function closeTestItemDropdown() {
  testItemDropdown.style.display = 'none';
}

async function selectTestItem(testItem) {
  closeTestItemDropdown();
  testItemInput.value = testItem.label;
  const res = await fetch('/api/test_item_search?item=' + encodeURIComponent(testItem.keyword));
  const items = await res.json();
  testResultsBox.style.display = 'flex';
  const rows = items.length
    ? items.map(testResultRowHtml).join('')
    : `<div class="empty-msg">"${escapeHtml(testItem.label)}" 항목이 있는 품목이 없습니다.</div>`;
  testResultsBox.innerHTML = `
    <div class="result-group">
      <div class="group-label">공정서 (${items.length})</div>
      ${rows}
    </div>
  `;
  testResultsBox.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => showDetail(el.dataset.id));
  });
  fitTestResultsHeight();
}

// 시험항목 검색 결과 카드는 창 크기에 맞춰 세로로 늘어나되, 창 아래끝에서
// 한 칸(약 48px) 정도는 남기고 그 안에서 카드 자체가 스크롤되게 한다.
function fitTestResultsHeight() {
  const group = testResultsBox.querySelector('.result-group');
  if (!group) return;
  const top = group.getBoundingClientRect().top;
  const bottomGap = 48;
  const height = window.innerHeight - top - bottomGap;
  group.style.maxHeight = Math.max(160, height) + 'px';
}

window.addEventListener('resize', fitTestResultsHeight);

testItemToggle.addEventListener('click', () => {
  if (testItemDropdown.style.display === 'block') {
    closeTestItemDropdown();
  } else {
    openTestItemDropdown();
  }
});

testItemInput.addEventListener('click', () => {
  if (testItemDropdown.style.display !== 'block') openTestItemDropdown();
});

document.addEventListener('click', (ev) => {
  if (!ev.target.closest('#nameTab .search-box')) closeComboDropdown();
  if (!ev.target.closest('#testTab .search-box')) closeTestItemDropdown();
});

detailBox.addEventListener('click', (ev) => {
  const link = ev.target.closest('.ref-link');
  if (!link) return;
  ev.preventDefault();
  showDetail(link.dataset.id);
});

searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (!q) {
    resultsBox.style.display = 'none';
    resultsBox.innerHTML = '';
    return;
  }
  debounceTimer = setTimeout(() => doSearch(q), 200);
});

searchInput.addEventListener('keydown', async (ev) => {
  if (ev.key !== 'Enter') return;
  ev.preventDefault();
  clearTimeout(debounceTimer);
  const q = searchInput.value.trim();
  if (!q) return;
  const data = await doSearch(q);
  const first = data.official[0] || data.sensory[0];
  if (first) {
    showDetail(first.id);
  }
});

async function doSearch(q) {
  const seq = ++requestSeq;
  const res = await fetch('/api/search?q=' + encodeURIComponent(q));
  const data = await res.json();
  if (seq === requestSeq) renderResults(data, q);
  return data;
}

function resultRowHtml(it) {
  return `
    <div class="result-item" data-id="${it.id}">
      <span class="rname">${renderName(it)}${sourceBadge(it.source_tag)}</span>
      <span class="rsub">${escapeHtml(it.english_name || '')}</span>
    </div>
  `;
}

function renderResults(data, q) {
  resultsBox.style.display = 'flex';
  const official = data.official || [];
  const sensory = data.sensory || [];
  if (official.length === 0 && sensory.length === 0) {
    resultsBox.innerHTML = `<div class="empty-msg">"${escapeHtml(q)}"에 대한 검색 결과가 없습니다.</div>`;
    return;
  }
  const officialRows = official.length
    ? official.map(resultRowHtml).join('')
    : `<div class="empty-msg">검색 결과가 없습니다.</div>`;
  const sensoryRows = sensory.length
    ? sensory.map(resultRowHtml).join('')
    : `<div class="empty-msg">검색 결과가 없습니다.</div>`;
  resultsBox.innerHTML = `
    <div class="result-group">
      <div class="group-label">공정서</div>
      ${officialRows}
    </div>
    <div class="result-group">
      <div class="group-label">관능검사해설서</div>
      ${sensoryRows}
    </div>
  `;
  resultsBox.querySelectorAll('.result-item').forEach(el => {
    el.addEventListener('click', () => showDetail(el.dataset.id));
  });

  if (official.length === 1 && sensory.length === 0) {
    showDetail(official[0].id);
  }
}

async function showDetail(id) {
  const res = await fetch('/api/item/' + id);
  if (!res.ok) return;
  const item = await res.json();

  if (item.kind === 'sensory') {
    showSensoryDetail(item);
    return;
  }

  const sectionsHtml = item.sections.map(sec => `
    <div class="section">
      <div class="label">${escapeHtml(sec.label)}</div>
      ${sec.items && sec.items.length ? renderItemList(sec.items) : `<div class="body">${renderSectionBody(sec)}</div>`}
    </div>
  `).join('');

  const definitionHtml = (item.definition_parts && item.definition_parts.length)
    ? item.definition_parts.map(p => `<p class="${p.small ? 'quantitative' : ''}">${p.html}</p>`).join('')
    : (item.definition ? `<p>${escapeHtml(item.definition)}</p>` : '');

  detailBox.classList.remove('sensory-mode');
  detailBox.innerHTML = `
    <button class="close-btn" id="closeDetail">&times;</button>
    <div class="detail-header">
      <h2>${renderName(item)}${sourceBadge(item.source_tag)}</h2>
      <p class="en">${escapeHtml(item.english_name || '')}</p>
      <p class="latin">${escapeHtml(item.latin_name || '')}</p>
    </div>
    ${definitionHtml ? `<div class="definition">${definitionHtml}</div>` : ''}
    ${sectionsHtml}
  `;
  _showDetailBox();
}

function showSensoryDetail(item) {
  const pdfUrl = `/api/sensory_pdf?file=${encodeURIComponent(item.source_file)}&start=${item.page_start}&end=${item.page_end}`;
  detailBox.classList.add('sensory-mode');
  detailBox.innerHTML = `
    <button class="sensory-close" id="closeDetail">&times;</button>
    <iframe class="sensory-frame" src="${pdfUrl}" title="${escapeHtml(item.korean_name)} 원본 페이지"></iframe>
  `;
  _showDetailBox();
}

function _showDetailBox() {
  detailBox.classList.add('show');
  detailPlaceholder.classList.add('hide');
  document.getElementById('closeDetail').addEventListener('click', () => {
    detailBox.classList.remove('show', 'sensory-mode');
    detailBox.innerHTML = '';
    detailPlaceholder.classList.remove('hide');
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// html 인자는 이미 이스케이프(및 <sub>/<table> 표시 처리)까지 끝난 문자열이어야 한다.
function linkifyRef(html, refId) {
  const m = html.match(/([「｢])([^」｣]+)([」｣])/);
  if (!m) return html;
  const before = html.slice(0, m.index);
  const [full, openBracket, name, closeBracket] = m;
  const after = html.slice(m.index + full.length);
  return `${before}${openBracket}<a href="#" class="ref-link" data-id="${refId}">${name}</a>${closeBracket}${after}`;
}

function renderSectionBody(sec) {
  const html = sec.html !== undefined ? sec.html : escapeHtml(sec.text);
  return (sec.ref_id !== undefined && sec.ref_id !== null) ? linkifyRef(html, sec.ref_id) : html;
}

function renderItemText(it) {
  const refId = (it.ref_id !== undefined && it.ref_id !== null) ? it.ref_id : null;
  if (it.bold !== undefined) {
    const boldHtml = it.bold_html !== undefined ? it.bold_html : escapeHtml(it.bold);
    const restHtml = it.rest_html !== undefined ? it.rest_html : escapeHtml(it.rest);
    const boldInner = it.bold ? (refId ? linkifyRef(boldHtml, refId) : boldHtml) : '';
    const boldPart = it.bold ? `<strong>${boldInner}</strong>` : '';
    const restPart = it.rest ? ` ${refId ? linkifyRef(restHtml, refId) : restHtml}` : '';
    return `${boldPart}${restPart}`;
  }
  const textHtml = it.text_html !== undefined ? it.text_html : escapeHtml(it.text);
  return refId ? linkifyRef(textHtml, refId) : textHtml;
}

function renderItemList(items) {
  const lis = items.map(it => `
    <li>
      ${it.marker ? `<span class="item-marker">${it.marker_html !== undefined ? it.marker_html : escapeHtml(it.marker)}</span>` : ''}
      <span class="item-text">${renderItemText(it)}</span>
      ${it.children && it.children.length ? renderItemList(it.children) : ''}
    </li>
  `).join('');
  return `<ol class="item-list">${lis}</ol>`;
}

function renderName(it) {
  const primary = it.name_primary || it.korean_name;
  const synonym = it.synonym_name || '';
  return `${escapeHtml(primary)}${synonym ? ` <span class="synonym">${escapeHtml(synonym)}</span>` : ''}`;
}

function sourceBadge(tag) {
  if (!tag) return '';
  return `<span class="source-badge">${escapeHtml(tag)}</span>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}
</script>
