<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>생약 검색</title>
<link rel="stylesheet" href="{{ asset('app.css') }}">
</head>
<body>
<header>
  <a class="org-badge" href="{{ url_for('index') }}" title="홈페이지로 이동">
    <img src="{{ url_for('static', filename='seoul_logo.png') }}" alt="서울시 휘장">
    <div class="org-name">
      <div class="org-full">서울시보건환경연구원</div>
      <div class="org-full">강북농수산물검사소</div>
      <div class="org-short">강북농수산물</div>
      <div class="org-short">검사소</div>
    </div>
  </a>
  <div class="header-inner">
    <h1>생약 검색</h1>
    <div class="header-meta">
      <p>공정서 {{ total_count }}품목, 관능검사해설서 {{ sensory_count }}품목</p>
      <p class="header-cite"><span class="cite-full">대한민국약전 의약품 각조 제2부</span><span class="cite-short">대한약전</span>(제2026-44호, 2026. 6. 29.) │ <span class="cite-full">대한민국약전외한약(생약)규격집</span><span class="cite-short">생약규격집</span><span class="cite-full"> 의약품 각조 제1부</span>(제2026-68호, 2026. 9. 30.)</p>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="left-panel">
    <div class="tab-bar">
      <button type="button" class="tab-btn active" id="nameTabBtn" data-tab="nameTab">생약 검색</button>
      <button type="button" class="tab-btn" id="testTabBtn" data-tab="testTab">시험항목 검색</button>
      <button type="button" class="tab-btn" id="prepTabBtn" data-tab="prepTab">생약제제 검색</button>
      <button type="button" class="collapse-btn" id="leftPanelCollapseBtn" title="왼쪽 화면 접기" aria-label="왼쪽 화면 접기">◀</button>
    </div>

    <div class="tab-panel active" id="nameTab">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="생약명을 입력하거나 목록에서 선택하세요." autocomplete="off">
        <button type="button" class="combo-toggle" id="comboToggle" aria-label="공정서 전체 목록 보기" title="공정서 전체 목록 보기">▾</button>
        <div class="combo-dropdown" id="comboDropdown" style="display:none;"></div>
      </div>
      <div class="results" id="results" style="display:none;"></div>
      <!-- 검색어가 없을 때(검색 결과가 안 보일 때) 보여 주는 즐겨찾기 / 최근 본 생약 -->
      <div class="results quick-box" id="quickBox" hidden></div>
    </div>

    <div class="tab-panel" id="testTab">
      <div class="search-box">
        <input type="text" id="testItemInput" placeholder="시험항목을 선택하세요." autocomplete="off" readonly>
        <button type="button" class="combo-toggle" id="testItemToggle" aria-label="시험항목 목록 보기" title="시험항목 목록 보기">▾</button>
        <div class="combo-dropdown" id="testItemDropdown" style="display:none;"></div>
      </div>
      <div class="results" id="testResults" style="display:none;"></div>
    </div>

    <div class="tab-panel" id="prepTab">
      <div class="search-box">
        <input type="text" id="prepInput" placeholder="생약제제명을 입력하거나 목록에서 선택하세요." autocomplete="off">
        <button type="button" class="combo-toggle" id="prepToggle" aria-label="생약제제 전체 목록 보기" title="생약제제 전체 목록 보기">▾</button>
        <div class="combo-dropdown" id="prepDropdown" style="display:none;"></div>
      </div>
      <div class="results" id="prepResults" style="display:none;"></div>
    </div>
  </div>
  <div class="panel-resizer" id="panelResizer"></div>
  <div class="right-panel">
    <div class="detail-placeholder" id="detailPlaceholder"></div>
    <div class="detail-wrap" id="detailWrap">
      <div class="detail-resizer" id="detailResizerLeft" aria-label="끌어서 너비 조절"></div>
      <div class="detail" id="detail"></div>
      <div class="detail-resizer" id="detailResizerRight" aria-label="끌어서 너비 조절"></div>
    </div>
  </div>
</div>

<div id="tmModal" class="tm-modal" hidden>
  <div class="tm-backdrop"></div>
  <div class="tm-dialog" role="dialog" aria-modal="true" aria-labelledby="tmTitle">
    <div class="tm-dialog-head"><span id="tmTitle"></span><button type="button" id="tmClose" aria-label="닫기">×</button></div>
    <div class="tm-dialog-body" id="tmBody"></div>
  </div>
</div>
<div id="famModal" class="fam-modal" hidden>
  <div class="fam-backdrop"></div>
  <div class="fam-dialog" role="dialog" aria-modal="true" aria-labelledby="famTitle">
    <div class="fam-dialog-head">
      <button type="button" id="famTitle" class="fam-title" aria-haspopup="listbox" aria-expanded="false" title="과를 골라 그 과의 생약 목록 보기"></button>
      <span class="fam-head-btns">
        <button type="button" id="famPin" class="fam-pin" aria-pressed="false" aria-label="고정" title="고정: 바깥을 누르거나 생약을 골라 설명창이 바뀌어도 팝업을 닫지 않음"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.2 1.6 14.4 5.8 12.9 6.3 10.8 9.3 11.3 11.1 10.4 12 4 5.6 4.9 4.7 6.7 5.2 9.7 3.1ZM5.6 10.4 1.6 14.4"/></svg></button>
        <button type="button" id="famClose" aria-label="닫기">×</button>
      </span>
    </div>
    <div class="fam-menu" id="famMenu" role="listbox" aria-label="과 목록" hidden></div>
    <div class="fam-dialog-body" id="famBody"></div>
  </div>
</div>
<script src="{{ asset('app.js') }}"></script>
</body>
</html>
